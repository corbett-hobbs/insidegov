name: ICE annual review

# ICE's figures are locked once published, but its URLs are unstable (dead links, new locations each
# year, dashboards with no export), so nothing here scrapes ICE. Monthly, pipeline/validate/ice-staleness.ts
# checks every ICE series (removals, by agency, by criminal history, administrative and at-large arrests,
# detainers, detention population) against the fiscal year ICE should have locked by now
# (lib/enforcement-entities.ts: ICE_REPORT_GRACE_DAYS), and whether DHS has published the next ICE budget
# overview. If anything is stale it opens ONE GitHub issue listing what; a rerun refreshes that issue, and
# it closes itself when the check passes. An issue, not a red build. Never blocks a deploy and never edits data.
#
# Exit codes: 0 current, 1 stale (issue), anything else is a crash and fails the run.

on:
  schedule:
    - cron: "43 14 1 * *" # 1st of each month, 14:43 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Is any ICE series behind?
        id: stale
        run: |
          set +e
          pnpm exec tsx pipeline/validate/ice-staleness.ts --report "$RUNNER_TEMP/ice-report.md" --notify-file "$RUNNER_TEMP/ice-notify.txt"
          code=$?
          echo "found=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "signal=$([ -f "$RUNNER_TEMP/ice-notify.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ] || exit "$code"

      # Was the DHS "published" signal already in the open issue? Then it has been announced; stay quiet.
      - name: Was the budget overview already announced?
        id: announced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(gh issue list --state open --label ice-annual-review --json body --jq '.[0].body // ""')"
          echo "yes=$(printf '%s' "$body" | grep -q 'DHS has published' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open, refresh or close the review issue
        id: issue
        uses: ./.github/actions/open-review-issue
        with:
          label: ice-annual-review
          label-description: ICE removals catalog needs a new year or series
          title: Add ICE's latest locked data (removals and breakdown series)
          body-file: ${{ runner.temp }}/ice-report.md
          found: ${{ steps.stale.outputs.found }}
          token: ${{ github.token }}

      # Push notification only for a REAL new-data signal (DHS published the next ICE budget overview), and only the
      # first time. The "ICE is overdue" findings are a reminder in the issue, not worth an email; ICE's addresses are
      # too unstable for this check to see a release itself.
      - name: Notify
        if: steps.stale.outputs.signal == 'true' && steps.announced.outputs.yes != 'true'
        uses: ./.github/actions/notify
        with:
          subject: "InsideGov: DHS published the next ICE budget overview"
          body: "DHS published a new ICE budget overview, which carries newer actuals. Details are in the issue."
          url: ${{ steps.issue.outputs.url }}
          smtp-server: ${{ secrets.NOTIFY_SMTP_SERVER }}
          smtp-port: ${{ secrets.NOTIFY_SMTP_PORT }}
          smtp-user: ${{ secrets.NOTIFY_SMTP_USER }}
          smtp-password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          email-to: ${{ secrets.NOTIFY_EMAIL_TO }}
          slack-webhook: ${{ secrets.NOTIFY_SLACK_WEBHOOK }}
