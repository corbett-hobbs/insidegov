name: Refugee admissions review

# The State Department renames its "Refugee Admissions Report as of <date>" workbook every month (posted around
# the 5th), so the catalog row cannot be fetched blindly: a person swaps it in (docs/REFUGEE_ADMISSIONS_METHODOLOGY.md,
# "Refreshing"). Weekly, pipeline/validate/refugee-staleness.ts reads the Refugee Processing Center's
# Admissions & Arrivals page, compares the newest workbook's date with the catalog's, and checks whether the
# next DHS refugee yearbook (a cross-check) is due. If so it opens ONE issue; a rerun refreshes it, and it closes
# itself once the catalog catches up. Never edits data and never blocks a deploy.
#
# Exit codes: 0 current, 1 stale (issue), anything else (page unreachable, layout changed) fails the run on purpose.

on:
  schedule:
    - cron: "21 13 * * 1" # Mondays 13:21 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Is a newer admissions workbook posted?
        id: stale
        run: |
          set +e
          pnpm exec tsx pipeline/validate/refugee-staleness.ts --report "$RUNNER_TEMP/refugee-report.md"
          code=$?
          echo "found=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ] || exit "$code"

      - name: Open, refresh or close the review issue
        id: issue
        uses: ./.github/actions/open-review-issue
        with:
          label: refugee-admissions-review
          label-description: Refugee catalog needs a newer State Department workbook or DHS yearbook
          title: Update the refugee admissions source data
          body-file: ${{ runner.temp }}/refugee-report.md
          found: ${{ steps.stale.outputs.found }}
          token: ${{ github.token }}

      # Push notification (email, then Slack) only when this run opened a NEW issue; reruns that refresh it stay quiet.
      - name: Notify
        if: steps.issue.outputs.created == 'true'
        uses: ./.github/actions/notify
        with:
          subject: "InsideGov: refugee source data needs updating"
          body: "A newer State Department admissions workbook is posted, or the DHS yearbook is due."
          url: ${{ steps.issue.outputs.url }}
          body-file: ${{ runner.temp }}/refugee-report.md
          smtp-server: ${{ secrets.NOTIFY_SMTP_SERVER }}
          smtp-port: ${{ secrets.NOTIFY_SMTP_PORT }}
          smtp-user: ${{ secrets.NOTIFY_SMTP_USER }}
          smtp-password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          email-to: ${{ secrets.NOTIFY_EMAIL_TO }}
          slack-webhook: ${{ secrets.NOTIFY_SLACK_WEBHOOK }}
