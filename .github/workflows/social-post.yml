name: Social post (scheduled, disabled)

# The posting scheduler. Approving a `social-draft` issue (label `social-approved`) only QUEUES it; at each slot this
# runs pipeline/insights/post-next.ts, which expires stale drafts and posts at most one (rules: pipeline/insights/schedule.ts):
#   - weekdays 9:00 a.m. Pacific (noon Eastern), and 1:00 p.m. Pacific (4:00 p.m. Eastern) only when 3+ drafts are
#     waiting. Cron is UTC with no daylight saving, so each slot runs at both UTC hours it can fall on (16 and 17,
#     20 and 21) and post-next.ts --slot auto keeps the one that is the slot's Pacific hour;
#   - at most 2 a day, 8 in any 7 days, 4 hours apart, a topic at most twice a week;
#   - the intro thread first; nothing past its freshness window (freshness.ts).
#
# DISABLED: scheduled runs do nothing until the repo variable SOCIAL_POSTING_ENABLED is "true". A manual run without
# it is a dry run that prints the decision. Each platform posts once its secrets are set:
#   Bluesky: BLUESKY_HANDLE, BLUESKY_APP_PASSWORD
#   X:       X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET (repo variable X_INCLUDE_LINK=true adds links)
# Setup: pipeline/insights/README.md, "Setting up the accounts".

on:
  schedule:
    - cron: "0 16,17 * * 1-5"
    - cron: "0 20,21 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to run (auto: whichever it is now, Pacific time)"
        type: choice
        options: [morning, afternoon, auto]
        default: morning
      dry_run:
        description: "Print the decision, post nothing"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    if: vars.SOCIAL_POSTING_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Post the next draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOCIAL_POSTING_ENABLED: ${{ vars.SOCIAL_POSTING_ENABLED }}
          X_INCLUDE_LINK: ${{ vars.X_INCLUDE_LINK }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SLOT: ${{ inputs.slot || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: pnpm exec tsx pipeline/insights/post-next.ts --slot "$SLOT" $DRY_RUN
