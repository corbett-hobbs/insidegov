<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsideGov subpages in branch themes (mock)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f1e7;--surface:#fffdf8;--ink:#1b2233;--ink-muted:#555e6e;--ink-faint:#8a8f9a;--line:#ddd4c2;--line-strong:#c4b9a3;--gold-soft:#e8c877;
 --dem:#3a66c2;--rep:#c24a3a;
 --serif:"Newsreader",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
/* per-branch theme tokens: this is all a branch layout would override */
[data-b=presidency]{--c:#1f3a68;--deep:#142748;--tint:#edf0f7;--tint2:#dde4f1;--ctext:#8fb0ea}
[data-b=congress]{--c:#2f6b4f;--deep:#1d4733;--tint:#ecf3ee;--tint2:#d8e8de;--ctext:#7fcaa3}
[data-b=court]{--c:#7a2e3b;--deep:#521c27;--tint:#f6ecee;--tint2:#ebd5d9;--ctext:#e29aa8}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.mock{background:var(--ink);color:#fff;font:500 11px var(--mono);padding:7px 20px;text-align:center}
.pick{position:sticky;top:0;z-index:30;background:rgba(246,241,231,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:center;padding:9px 12px;flex-wrap:wrap;align-items:center;font:500 12px var(--mono);color:var(--ink-muted)}
.pick button{font:500 13px var(--sans);border:1px solid var(--line-strong);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--ink)}
.pick button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.page{background:var(--tint);min-height:100vh;transition:background .3s}
/* site header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:stretch;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font:600 22px var(--serif);padding:12px 0;align-self:center}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs a{display:flex;align-items:center;padding:0 14px;border-bottom:3px solid transparent;font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--ink-muted);height:52px;white-space:nowrap}
.tabs a[data-t=presidency]{--tc:#1f3a68}.tabs a[data-t=congress]{--tc:#2f6b4f}.tabs a[data-t=court]{--tc:#7a2e3b}
.tabs a.on{color:var(--ink);border-color:var(--tc)}
.tabs a:hover{color:var(--ink)}
/* hero band */
.band{background:linear-gradient(135deg,var(--deep),var(--c));color:#fff}
.subnav{display:flex;gap:8px;overflow-x:auto;padding:16px 0 0}
.subnav a{font:500 13px var(--sans);padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.88);white-space:nowrap;transition:background .2s}
.subnav a:hover{background:rgba(255,255,255,.12)}
.subnav a.on{background:#fff;color:var(--c);border-color:#fff;font-weight:600}
.band .hd{padding:30px 0 40px}
.eyebrow{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--gold-soft);display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:30px;height:1px;background:var(--gold-soft)}
.band h1{font:500 clamp(34px,4.6vw,54px)/1.05 var(--serif);letter-spacing:-.02em;margin-top:12px}
.band p{margin-top:14px;font-size:16px;color:rgba(255,255,255,.86)}
/* body */
main{padding:26px 0 70px}
.filters{position:sticky;top:44px;z-index:10;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:10px 14px;margin-bottom:18px;box-shadow:0 6px 16px -12px rgba(20,30,50,.4)}
.filters label{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint)}
.chip{font:500 13px var(--sans);padding:5px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-muted)}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.sep{width:1px;height:22px;background:var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel h2{font:500 24px var(--serif);letter-spacing:-.01em;color:var(--ink)}
.panel h2 + p{color:var(--ink-muted);font-size:14px;margin-top:4px}
.panel svg{display:block;width:100%;height:auto;margin-top:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font:400 11.5px var(--mono);color:var(--ink-muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.grid{display:grid;gap:18px}
@media(min-width:900px){.grid{grid-template-columns:2fr 1fr}}
.stat{border-left:4px solid var(--c);background:var(--surface);border-radius:0 12px 12px 0;padding:16px 18px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat b{display:block;font:500 40px/1 var(--serif);letter-spacing:-.025em;color:var(--c)}
.stat span{font-size:13px;color:var(--ink-muted)}
.side{display:grid;gap:14px;align-content:start}
.notes{margin-top:18px;border-top:1px solid var(--line-strong);padding-top:12px}
.notes h3{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--c);margin-bottom:6px}
.notes p{font-size:13.5px;color:var(--ink-muted);max-width:none}
.notes a{color:var(--c);font-weight:600;border-bottom:1px solid var(--c)}
.axis{font:400 10px var(--mono);fill:#8a8f9a}
footer{background:var(--ink);color:#aab3c4;padding:30px 0;font-size:13px}
</style>
</head>
<body>
<div class="mock">DESIGN MOCK · branch-themed subpages · only the tokens in the first block of CSS change per branch · charts keep their data colours · shapes are placeholders</div>
<div class="pick"><span>Subpage:</span>
  <button data-p="presidency" aria-pressed="true">Presidency · Executive orders</button>
  <button data-p="congress" aria-pressed="false">Congress · Ideology</button>
  <button data-p="court" aria-pressed="false">Supreme Court · Ideology</button></div>
<div id="root"></div>
<footer><div class="wrap">InsideGov · Public records on the presidency, Congress, and the Supreme Court.</div></footer>

<script>
let seed=5;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,g=()=>rnd()+rnd()+rnd()-1.5;
const NAV={presidency:["Executive orders","Economy","Energy","Immigration","Trade","Foreign aid","National security"],congress:["Ideology","Laws","Demographics","Wealth"],court:["Ideology","Decisions"]};
const TOPIC=["#7b4f87","#c28a2c","#3e9886","#6f9a3c","#d0627f","#8a5a3c","#5a86b5","#4a4a4a","#9a8fd0"];
const TLAB=["Government operations","Economy, labor & tech","Trade & tariffs","Energy & environment","Health & education","Immigration & justice","Foreign policy","National security","Civil rights & civic life"];
const EO=[[16,6,5,7,2,1,8,8,1],[8,5,3,5,3,0,8,8,0],[9,7,5,5,7,4,5,6,1],[6,8,3,3,7,0,5,5,1],[9,5,1,5,3,0,6,7,2],[7,2,4,4,1,1,5,9,2],[13,9,2,4,6,0,1,1,5],[20,13,4,6,8,0,6,8,1],[9,4,1,1,6,3,2,5,0],[13,1,1,2,3,3,10,6,2],[9,8,0,4,5,1,8,10,0],[7,6,0,1,1,0,4,7,0],[8,3,0,0,2,3,7,4,0],[7,2,2,5,3,0,7,6,0],[13,3,0,1,1,1,5,6,0],[15,10,1,2,6,1,2,5,2],[10,4,2,3,5,0,5,6,0],[9,7,0,1,3,0,10,4,0],[10,5,2,3,3,1,11,4,0],[7,2,1,3,1,0,2,3,1],[3,7,2,2,2,2,9,4,0],[6,4,1,3,3,1,7,4,0],[15,3,3,4,1,0,8,8,0],[16,11,4,6,5,9,6,4,1],[12,7,0,3,1,3,7,4,0],[9,8,1,2,6,4,9,5,1],[7,16,5,2,17,3,7,10,2],[12,17,0,7,19,12,12,7,5],[1,7,0,2,4,1,8,4,2],[4,3,0,2,3,1,2,7,2],[4,5,0,0,3,1,2,3,1],[54,28,34,22,25,21,19,21,14],[8,16,3,6,8,5,6,8,4]];

function eoChart(){const W=640,H=300,L=34,B=26,T=8,n=EO.length,slot=(W-L-6)/n,bw=slot*.8,max=Math.max(...EO.map(r=>r.reduce((a,b)=>a+b,0)));let o='';
 [0,50,100,150,200].forEach(v=>{const y=H-B-v/max*(H-B-T);o+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#ece5d6"/><text class="axis" x="${L-6}" y="${y+3}" text-anchor="end">${v}</text>`});
 EO.forEach((r,i)=>{let a=0;r.forEach((v,k)=>{if(!v)return;const h=v/max*(H-B-T),y=H-B-(a+v)/max*(H-B-T);a+=v;o+=`<rect x="${(L+i*slot+(slot-bw)/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${TOPIC[k]}"/>`})});
 [0,8,16,24,32].forEach(i=>{o+=`<text class="axis" x="${L+i*slot+slot/2}" y="${H-8}" text-anchor="middle">${1994+i}</text>`});
 // term bands
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Executive orders per year by topic (real counts)">${o}</svg>`}
function compass(){let o='<line x1="320" y1="10" x2="320" y2="330" stroke="#d9d0bd" stroke-dasharray="3 5"/><line x1="12" y1="170" x2="628" y2="170" stroke="#d9d0bd" stroke-dasharray="3 5"/>';
 for(let i=0;i<260;i++)o+=`<circle cx="${(185+g()*130).toFixed(1)}" cy="${(185+g()*120).toFixed(1)}" r="4.4" fill="#3a66c2" opacity=".72"/>`;
 for(let i=0;i<270;i++)o+=`<circle cx="${(470+g()*110).toFixed(1)}" cy="${(160+g()*110).toFixed(1)}" r="4.4" fill="#c24a3a" opacity=".72"/>`;
 o+=`<circle cx="330" cy="150" r="9" fill="none" stroke="#2f6b4f" stroke-width="3"/><text class="axis" x="346" y="130" fill="#2f6b4f" style="fill:#2f6b4f;font-weight:500">Selected member</text>`;
 o+=`<text class="axis" x="12" y="346">MORE LIBERAL</text><text class="axis" x="628" y="346" text-anchor="end">MORE CONSERVATIVE</text>`;
 return `<svg viewBox="0 0 640 354" role="img" aria-label="Members of Congress by ideology (placeholder)">${o}</svg>`}
function court(){const W=640,H=300,L=34,B=24,T=8;let o='';
 [-4,-2,0,2,4].forEach(v=>{const y=T+(4-v)/8*(H-B-T);o+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="${v===0?'#cfc5b0':'#ece5d6'}"/><text class="axis" x="${L-6}" y="${y+3}" text-anchor="end">${v}</text>`});
 const J=[[-2.2,"D"],[-1.6,"D"],[-1.1,"D"],[-.2,"R"],[.6,"R"],[1.1,"R"],[1.6,"R"],[2.0,"R"],[2.6,"R"]];
 J.forEach(([m,p],k)=>{let y=m,d='';for(let i=0;i<=44;i++){y+= (rnd()-.5)*.12;const px=L+i/44*(W-L-8),py=T+(4-y)/8*(H-B-T);d+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}
  o+=`<path d="${d}" fill="none" stroke="${p==='R'?'#c24a3a':'#3a66c2'}" stroke-width="2.2" opacity=".85"/>`});
 let med='';for(let i=0;i<=44;i++){const yy=.15+Math.sin(i/9)*.35+i/44*.5;med+=(i?'L':'M')+(L+i/44*(W-L-8)).toFixed(1)+' '+(T+(4-yy)/8*(H-B-T)).toFixed(1)}
 o+=`<path d="${med}" fill="none" stroke="#7a2e3b" stroke-width="3.5" stroke-dasharray="7 5"/>`;
 [0,11,22,33,44].forEach(i=>{o+=`<text class="axis" x="${L+i/44*(W-L-8)}" y="${H-6}" text-anchor="middle">${1937+Math.round(i*2)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Justice ideology over time (placeholder)">${o}</svg>`}

const CFG={
 presidency:{label:"Presidency",eb:"Presidency · Executive orders",title:"Executive orders",intro:"Every executive order since 1994, by year and topic, set against each presidential term.",
  chips:[["Count","on"],["Share"],["sep"],["All presidents","on"],["Biden"],["Trump"]],h:"Orders signed per year",sub:"Stacked by topic. Click a year to list its orders.",
  chart:eoChart,legend:TLAB.map((l,i)=>`<span><i style="background:${TOPIC[i]}"></i>${l}</span>`).join(''),stat:["1,545","executive orders signed since 1994"],stat2:["2025","the busiest year on record"],
  note:"Topics are assigned by a model and manually reviewed. Counts come from the Federal Register. <a href=\"#\">Read the methodology</a>."},
 congress:{label:"Congress",eb:"Congress · Ideology",title:"Ideology",intro:"Every member of the House and Senate placed on a two-dimensional map from their roll-call votes.",
  chips:[["Both chambers","on"],["House"],["Senate"],["sep"],["119th Congress","on"],["Compare"]],h:"Where members sit",sub:"Each dot is a member; position comes from roll-call votes (DW-NOMINATE).",
  chart:compass,legend:'<span><i style="background:#3a66c2;border-radius:50%"></i>Democratic</span><span><i style="background:#c24a3a;border-radius:50%"></i>Republican</span><span><i style="background:#83817d;border-radius:50%"></i>Independent</span>',stat:["Most divided since 1903","the two parties are farther apart than at any point since"],stat2:["535","members plotted"],
  note:"Scores are estimated from roll-call votes, not from stated positions. <a href=\"#\">Read the methodology</a>."},
 court:{label:"Supreme Court",eb:"Supreme Court · Ideology",title:"Ideology",intro:"Where each justice has sat since 1937 and how the Court’s median has moved, term by term.",
  chips:[["All justices","on"],["Current Court"],["sep"],["1937 to 2024","on"],["Show median"]],h:"Justice ideology by term",sub:"Martin–Quinn scores. Dashed line is the Court’s median justice.",
  chart:court,legend:'<span><i style="background:#3a66c2"></i>Appointed by a Democrat</span><span><i style="background:#c24a3a"></i>Appointed by a Republican</span><span><i style="background:#7a2e3b"></i>Court median</span>',stat:["6 of 9","justices were appointed by Republican presidents, 2024 term"],stat2:["88","years of data"],
  note:"Martin–Quinn scores are model estimates with uncertainty. <a href=\"#\">Read the methodology</a>."}
};

function render(k){const c=CFG[k];const keys=Object.keys(CFG);
 document.getElementById('root').innerHTML=`<div class="page" data-b="${k}">
 <div class="top"><div class="wrap"><a class="logo" href="#">InsideGov</a><nav class="tabs">${keys.map(x=>`<a href="#" data-t="${x}" class="${x===k?'on':''}">${CFG[x].label}</a>`).join('')}</nav></div></div>
 <div class="band"><div class="wrap"><nav class="subnav">${NAV[k].map((s,i)=>`<a href="#" class="${s===c.title&&i===0||(s===c.title)?'on':''}">${s}</a>`).join('')}</nav>
  <div class="hd"><div class="eyebrow">${c.eb}</div><h1>${c.title}</h1><p>${c.intro}</p></div></div></div>
 <main class="wrap">
  <div class="filters"><label>View</label>${c.chips.map(x=>x[0]==='sep'?'<span class="sep"></span>':`<span class="chip ${x[1]||''}">${x[0]}</span>`).join('')}</div>
  <div class="grid"><section class="panel"><h2>${c.h}</h2><p>${c.sub}</p>${c.chart()}<div class="legend">${c.legend}</div>
   <div class="notes"><h3>Data notes</h3><p>${c.note}</p></div></section>
  <aside class="side"><div class="stat"><b>${c.stat[0]}</b><span>${c.stat[1]}</span></div><div class="stat"><b>${c.stat2[0]}</b><span>${c.stat2[1]}</span></div></aside></div>
 </main></div>`;
 document.querySelectorAll('.pick button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===k));
 document.querySelectorAll('.tabs a').forEach(a=>a.onclick=e=>{e.preventDefault();render(a.dataset.t)});}
document.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{seed=5;render(b.dataset.p)});
render('presidency');
</script>
</body>
</html>
